[project]
name = "adaptive-ai-teacher"
version = "1.0.0"
description = "A dynamic ReAct teaching agent for plain-text learning material."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pinecone>=7,<9",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
